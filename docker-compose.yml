version: "3.8"

services:

  # ── SERVICE 1 : Base de données ──────────────────
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensante
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:          # ← TA PARTIE CLÉ
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── SERVICE 2 : Application Next.js ──────────────
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/sensante?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "http://localhost:3000"
      GROQ_API_KEY: "${GROQ_API_KEY}"
    depends_on:
      db:
        condition: service_healthy  # ← attend que db soit prête

# ── VOLUME PERSISTANT ────────────────────────────
volumes:
  pgdata:
